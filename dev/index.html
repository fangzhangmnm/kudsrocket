<!doctype html>
<!-- created 20261014 by Claude Opus 5.5 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- CSP（2026-10-17，user「csp…一起上」，和记住口令一起）：脚本只准本站文件 + wasm（核、音频 worklet 都是本站）；iframe 只准微软登录（MSAL 后台续登录）；connect-src 放 https: 是因为 OneDrive 的下载 / 上传主机不固定。test/csp.test.ts 钉着。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://login.microsoftonline.com https://login.live.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>KudsRocket</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css?v=1e51002b5beb">
</head>
<body>
<main id="home">
  <header class="home-head"><h1>KudsRocket</h1><button id="version" class="muted version"></button></header>
  <div id="account" class="account"></div>
  <div id="sync-home" class="sync-home idle muted" hidden></div>
  <!-- 主页三组（10-17 整理，user「主页也整理」）：盘 / 存档 / 这台设备，每组一个小标题；按钮 id 不变（接线和测试照旧）。added 20261017 by Claude Opus 5.5 -->
  <section class="library-head">
    <h2>盘</h2>
    <button id="unlock" hidden>输入口令</button>
    <button id="refresh" title="重新列一次 OneDrive 里的内容">刷新</button>
  </section>
  <div id="library" class="library"></div>
  <section id="tools" class="tools" hidden>
    <div class="tool-group">
      <h3>加盘 / 换格式</h3>
      <button id="upload-wafter" title="选一个本机文件，边加密边传进 OneDrive，不留本机副本（iPad / Quest 也能用）">上传盘…</button>
      <button id="open-local" title="直接开这台设备上的一个文件（不进盘库）">本机文件…</button>
      <button id="make-wafter" title="把一个镜像加密成 .wafter，写成这台电脑上的文件">做加密盘…</button>
      <button id="unwrap-wafter" title="把 .wafter 解回原来的镜像，写成这台电脑上的文件">解密盘…</button>
      <p id="tools-hint" class="muted" hidden>做加密盘 / 解密盘要用电脑上的 Chrome 或 Edge（要能直接写本机文件）。</p>
    </div>
    <div class="tool-group">
      <h3>存档</h3>
      <button id="save-manager" title="所有盘的快照和游戏存档：同步状态、要处理的、按游戏分组">存档管理…</button>
      <button id="bins" title="删掉的、被替换下来的都在这里，能恢复">回收站 / 备份箱…</button>
      <button id="pack-saves" title="把 PPSSPP 记忆棒里的存档（SAVEDATA 文件夹或 zip）装进云端：云端没有的新建，一样的跳过，不一样的不动">存档装罐…</button>
      <button id="unpack-saves" title="把云端的存档解成 PPSSPP 能用的 SAVEDATA，打成 zip 下载">存档解罐…</button>
    </div>
    <div class="tool-group">
      <h3>这台设备</h3>
      <button id="clear-cache" title="放掉所有已同步的本机副本（没传上去的不动）">清本机缓存</button>
      <button id="mirrors" title="读盘先从这台设备上的文件 / 自己电脑上的镜像拿，拿不到再走 OneDrive">盘的镜像…</button>
      <label class="muted">暂存区上限 <select id="staging-cap"></select></label>
      <button id="force-update" title="清掉这个 app 自己的离线壳缓存并重新载入">强制更新</button>
    </div>
    <input type="file" id="local-file" hidden>
    <input type="file" id="upload-file" hidden>
    <input type="file" id="mirror-files" multiple hidden>
  </section>
</main>

<main id="game" hidden>
  <div id="toolbar" class="toolbar"><span id="title"></span><span id="hud" class="hud muted"></span></div>
  <!-- #gl 在核启动时以 OffscreenCanvas 交给核线程（GPU 渲染）；#screen 是软件渲染兜底，主线程画 -->
  <div id="stage">
    <canvas id="gl" width="480" height="272"></canvas>
    <canvas id="screen" width="480" height="272" hidden></canvas>
    <div id="paused-mark" hidden>暂停中</div>
    <div id="resume-cover" hidden></div>
    <div id="syncbar" class="syncbar idle" hidden></div>
  </div>
  <pre id="status" hidden></pre>
</main>

<div id="banners"></div>
<div id="note" hidden></div>
<div id="update" hidden></div>
<div id="busy" hidden><span></span></div>
<script type="module" src="./dist/kudsrocket-1e51002b5beb.mjs"></script>
</body>
</html>
